global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yaml

scrape_configs:
  - job_name: genai
    static_configs:
      - targets:
          - llm-gateway:9464
          - prompt-registry:9464
          - retrieval:9464
          - ingestion:9464
          - assistant:9464
          - agents:9464
          - mcp-gateway:9464
