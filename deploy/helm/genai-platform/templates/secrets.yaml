{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- $secrets := include "genai.secrets" $ctx | fromJsonArray }}
{{- if $secrets }}
---
# Mounts exactly the vault secrets this service reads, with this service's own identity, and
# mirrors them into a Kubernetes secret so they reach the process as environment variables.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}
  labels:
    {{- include "genai.labels" $ctx | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ index $.Values.serviceIdentities $name | quote }}
    keyvaultName: {{ required "azure.keyVaultName is required" $.Values.azure.keyVaultName | quote }}
    tenantId: {{ required "azure.tenantId is required" $.Values.azure.tenantId | quote }}
    objects: |
      array:
        {{- range $secrets }}
        - |
          objectName: {{ .name }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ $name }}-secrets
      type: Opaque
      data:
        {{- range $secrets }}
        - { objectName: {{ .name }}, key: {{ .name }} }
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
