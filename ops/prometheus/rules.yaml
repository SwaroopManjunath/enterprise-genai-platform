  - name: slo-alerts
    rules:
      - alert: AssistantAvailabilityFastBurn
        expr: "slo:sli_error:ratio_rate1h{slo=\"assistant-availability\"} > 0.072 and slo:sli_error:ratio_rate5m{slo=\"assistant-availability\"} > 0.072"
        for: 2m
        labels:
          severity: page
          slo: "assistant-availability"
        annotations:
          summary: "Assistant availability: the error budget is burning 14.4x too fast"
          description: "More than 7.20% of events are bad over both 1h and 5m. At this rate 2.0% of the 30-day budget goes in 1h. A question is answered, or refused for a reason, not dropped by a server fault."
          runbook: "docs/runbooks/assistant-availability.md"
      - alert: AssistantAvailabilitySlowBurn
        expr: "slo:sli_error:ratio_rate6h{slo=\"assistant-availability\"} > 0.03 and slo:sli_error:ratio_rate30m{slo=\"assistant-availability\"} > 0.03"
