      - alert: ModelFallbackServing
        expr: "sum(rate(genai_llm_calls_total{outcome=\"fallback_served\"}[15m])) / sum(rate(genai_llm_calls_total{outcome=~\"ok|fallback_served\"}[15m])) > 0.2"
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "More than 20% of answers are coming from the fallback model"
          description: "The primary deployment is failing or throttled and the fallback is covering. Users are still served, but the fallback has less headroom and may answer differently."
          runbook: "docs/runbooks/model-fallback.md"
      - alert: IngestionDeadLettered
        expr: "sum(increase(genai_ingestion_jobs_total{result=\"dead_lettered\"}[15m])) > 0"
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "A document gave up after its retries"
          description: "A job exhausted its attempts and sits in the dead-letter queue. The document is not searchable, and nothing will retry it on its own."
          runbook: "docs/runbooks/ingestion-dead-letter.md"
      - alert: McpToolDefinitionChanged
        expr: "sum(increase(genai_mcp_calls_total{outcome=\"tool_changed\"}[15m])) > 0"
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "A tool changed after it was reviewed, and calls to it were refused"
          description: "An MCP server now describes a tool differently from the version a person approved. It is quarantined until someone reviews it. This may be an upgrade; it may be an attack."
          runbook: "docs/runbooks/mcp-tool-changed.md"
