name: Delivery

# Everything that gets the platform from a commit to a cluster, checked on every pull request: the
# images build, are small in attack surface and scan clean; the platform runs from them with its
# monitoring and passes its smoke test; the Helm chart renders valid manifests that are safe by
# default; the Terraform is valid.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3006: the base image is an ARG whose default is tagged (node:22-bookworm-slim), which this
          # version of hadolint cannot see through. DL3066: the user is named, not numbered; the chart
          # pins uid 1000 anyway.
          ignore: DL3006,DL3066

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          [llm-gateway, prompt-registry, ingestion, retrieval, assistant, agents, mcp-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          tags: genai/${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Runs as an unprivileged user and refuses to start unconfigured
        run: |
          test "$(docker run --rm genai/${{ matrix.service }}:ci id -u)" = "1000"
          ! docker run --rm genai/${{ matrix.service }}:ci >/dev/null 2>&1
      - name: Scan for vulnerabilities (high and critical, with a fix available)
        # The same command that is run locally, rather than an action that installs its own binary.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml" \
            aquasec/trivy:0.65.0 image --quiet \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore.yaml --exit-code 1 \
            genai/${{ matrix.service }}:ci

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Start the platform with Prometheus, Grafana and Jaeger
        run: docker compose -f deploy/compose/docker-compose.yml up --build -d
      - name: Smoke test through the real API, and check the metrics, trace and rules
        run: docker compose -f deploy/compose/docker-compose.yml run --rm smoke
      - name: Logs, if it failed
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail 80
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @genai/shared -w @genai/auth -w @genai/guardrails -w @genai/observability
      - name: Lint
        run: helm lint deploy/helm/genai-platform -f deploy/helm/genai-platform/ci/full.yaml
      - name: Render
        run: helm template genai deploy/helm/genai-platform -f deploy/helm/genai-platform/ci/full.yaml --namespace genai > rendered.yaml
      - name: Validate against the Kubernetes and CRD schemas
        run: |
          docker run --rm -v "$PWD/rendered.yaml:/r.yaml" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /r.yaml
      - name: Policy tests (hardening, network, secrets, canary, agreement with Terraform and the SLOs)
        run: npm test -w @genai/delivery

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
