name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint commit messages (PRs only)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Quality gate: the system is run against a labelled dataset and the build fails if answers
      # get worse (see tests/evals/README.md). The report is also shown on the run's summary page.
      - name: Evaluation gate
        run: npm run eval -w @genai/evals

      # The gate itself must be able to fail: each known regression is played back and must be caught.
      - name: Evaluation gate self-test
        run: npm run eval:selftest -w @genai/evals

      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: tests/evals/results/
          if-no-files-found: ignore
          retention-days: 30
